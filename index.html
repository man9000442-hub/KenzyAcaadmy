    <style>
         :root {
            --black: #0a0a0a;
            --white: #ffffff;
            --gray-light: #f4f4f5;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--gray-light);
            color: var(--black);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
         ::-webkit-scrollbar {
            width: 6px;
        }
        
         ::-webkit-scrollbar-track {
            background: var(--white);
        }
        
         ::-webkit-scrollbar-thumb {
            background: var(--black);
            border-radius: 10px;
        }
        /* شاشة التحميل */
        
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--white);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .thin-text {
            font-family: sans-serif;
            font-weight: 100;
            letter-spacing: 3px;
            margin-top: 15px;
            color: var(--black);
            text-transform: uppercase;
        }
        
        .loader-circle {
            width: 50px;
            height: 50px;
            border: 1px solid #e5e5e5;
            border-top-color: var(--black);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        /* الأنيميشن */
        
        .reveal-up {
            opacity: 0;
            transform: translateY(40px);
            animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-100 {
            animation-delay: 0.1s;
        }
        
        .delay-200 {
            animation-delay: 0.2s;
        }
        
        .delay-300 {
            animation-delay: 0.3s;
        }
        
        @keyframes revealUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* التصميم النقي B&W Neo-Brutalism */
        
        .card-neo {
            background: var(--white);
            border: 2px solid var(--black);
            box-shadow: 8px 8px 0px 0px var(--black);
            transition: all 0.3s ease;
        }
        
        .card-neo-hover:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px 0px var(--black);
        }
        
        .modern-input {
            width: 100%;
            background-color: var(--white);
            border: 2px solid #e5e5e5;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .modern-input:focus {
            border-color: var(--black);
            box-shadow: 4px 4px 0px 0px var(--black);
            transform: translate(-2px, -2px);
        }
        
        .btn-sweep {
            position: relative;
            background: transparent;
            color: var(--black);
            border: 2px solid var(--black);
            overflow: hidden;
            z-index: 1;
            transition: color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        
        .btn-sweep::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--black);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .btn-sweep:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }
        
        .btn-sweep:hover {
            color: var(--white);
        }
        
        .radio-label {
            display: flex;
            align-items: center;
            padding: 1.25rem;
            border: 2px solid #e5e5e5;
            background: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .radio-label:hover {
            border-color: var(--black);
        }
        
        .selected-answer {
            border-color: var(--black) !important;
            background-color: var(--black) !important;
            color: var(--white) !important;
            box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 0.2);
            transform: translate(-2px, -2px);
        }
        
        #progress-container {
            width: 100%;
            height: 4px;
            background: #e5e5e5;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 50;
        }
        
        #progress-bar {
            height: 100%;
            background: var(--black);
            width: 0%;
            transition: width 0.4s ease;
        }
        
        #qrcode img {
            margin: 0 auto;
            border: 4px solid var(--black);
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

        // دالة الاتصال بـ Supabase
        async function supabaseRequest(method, table, query = "", body = null) {
            const url = `${SUPABASE_URL}/rest/v1/${table}${query}`;
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            };
            if (method === "POST" || method === "PATCH") options.headers['Prefer'] = 'return=representation';
            if (body) options.body = JSON.stringify(body);

            const res = await fetch(url, options);
            if (!res.ok) throw new Error("Request failed");
            if (method === "DELETE" || res.status === 204) return true;
            return await res.json();

            const container = document.getElementById('videos-container');
            const filter = document.getElementById('video-class-filter').value;
            container.innerHTML = '<p class="text-center text-gray-400 font-bold"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري تحميل الفيديوهات...</p>';

            try {
                let query = '?order=id.desc';
                if (filter !== 'all') query += `&class_name=eq.${encodeURIComponent(filter)}`;

                const videos = await supabaseRequest('GET', 'kenzy_videos', query);

                if (videos.length === 0) {
                    container.innerHTML = '<div class="p-6 border-2 border-dashed border-gray-300 text-center font-bold text-gray-400">لا توجد محاضرات متاحة لهذا الصف حالياً.</div>';
                    return;
                }

                container.innerHTML = videos.map((v, i) => `
                    <div class="p-5 border-2 border-black hover:bg-gray-50 transition flex flex-col md:flex-row justify-between items-center gap-4 reveal-up" style="animation-delay: ${i * 0.1}s">
                        <div class="text-center md:text-right">
                            <h3 class="font-black text-lg">${v.title}</h3>
                            <span class="text-xs font-bold bg-black text-white px-2 py-1 uppercase mt-1 inline-block">${v.class_name}</span>
                        </div>
                        <button onclick="openVideoModal('${v.youtube_url}', '${v.title}')" class="btn-sweep px-6 py-2 font-bold text-sm flex items-center justify-center gap-2 whitespace-nowrap w-full md:w-auto">
                            <i class="fa-solid fa-play"></i> تشغيل المحاضرة
                        </button>
                    </div>
                `).join('');

            } catch (e) {
                container.innerHTML = '<p class="text-red-500 font-bold text-center">حدث خطأ أثناء الاتصال بقاعدة البيانات.</p>';
            }
        }

        // ==========================================
        // قسم الاختبارات والتحقق
        // ==========================================

        // تصفية الكود لايف (مسح المسافات والعربي)
        function sanitizeCode(inputElement) {
            let val = inputElement.value;
            // إزالة أي مسافات
            val = val.replace(/\s+/g, '');
            // الاحتفاظ فقط بالحروف الإنجليزية (كابيتال وسمول) والأرقام والداش (-)
            val = val.replace(/[^a-zA-Z0-9-]/g, '');
            // تحويل الحروف لكابيتال (اختياري عشان الشكل)
            inputElement.value = val.toUpperCase();
        }

        async function handleLogin() {
            const name = document.getElementById("inputName").value.trim();
            const code = document.getElementById("inputCode").value.trim();
            const phone = document.getElementById("inputPhone").value.trim();
            const cls = document.getElementById("inputClass").value;
            const grp = document.getElementById("inputGroup").value;

            const btn = document.getElementById("loginBtn");
            const err = document.getElementById("loginError");

            if (!name || !code || !phone || !cls || !grp) {
                err.textContent = "يرجى استكمال جميع البيانات قبل الدخول.";
                err.classList.remove("hidden");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري فحص البيانات...';
            err.classList.add("hidden");

            try {
                student = {
                    name,
                    code,
                    phone,
                    className: cls,
                    groupName: grp
                };

                // 1. فحص هل يوجد امتحان مفعل لهذا الصف
                const activeQuiz = await supabaseRequest('GET', 'kenzy_quizzes', `?class_name=eq.${encodeURIComponent(cls)}&is_active=eq.true&limit=1`);

                if (!activeQuiz.length) {
                    throw new Error("لا يوجد امتحان متاح لصفك في الوقت الحالي.");
                }
                currentQuizId = activeQuiz[0].id;

                // 2. فحص هل الطالب امتحن الاختبار ده قبل كده
                const existingResult = await supabaseRequest('GET', 'kenzy_results', `?student_code=eq.${code}&quiz_id=eq.${currentQuizId}&limit=1`);

                if (existingResult.length > 0) {
                    throw new Error("لقد قمت بأداء هذا الاختبار مسبقاً! غير مسموح بالتكرار.");
                }

                // 3. جلب الأسئلة
                const qsData = await supabaseRequest('GET', 'kenzy_questions', `?quiz_id=eq.${currentQuizId}`);
                if (!qsData.length) throw new Error("الامتحان لا يحتوي على أسئلة بعد.");

                questions = qsData.map(q => ({
                    id: q.id,
                    text: q.question_text,
                    choices: [q.choice_a, q.choice_b, q.choice_c, q.choice_d],
                    correct: q.correct_answer // بيحتوي على A, B, C, D
                }));

                // الدخول للامتحان
                document.getElementById('quiz-login-section').classList.add('hidden');
                displayExam();

            } catch (e) {
                err.textContent = e.message || "حدث خطأ في الاتصال بقاعدة البيانات.";
                err.classList.remove("hidden");
                btn.disabled = false;
                btn.innerHTML = '<span>فحص وبدء الاختبار</span> <i class="fa-solid fa-bolt"></i>';
            }
        }

        function displayExam() {
            document.getElementById("progress-container").classList.remove("hidden");
            document.getElementById("quiz-section").classList.remove("hidden");

            document.getElementById("displayStudentName").textContent = student.name;
            document.getElementById("displayGroupInfo").textContent = `مجموعة: ${student.groupName}`;
            document.getElementById("displayClassName").textContent = student.className;

            const form = document.getElementById("quizForm");

            // خلط الاختيارات إذا أردت (هنا عرض مباشر)
            form.innerHTML = questions.map((q, i) => `
                <div class="card-neo p-6 md:p-8 reveal-up" style="animation-delay: ${i * 0.1}s">
                    <div class="flex gap-4 mb-6">
                        <span class="text-4xl font-black text-gray-200">0${i+1}</span>
                        <p class="font-bold text-xl pt-2">${q.text}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 choices-area">
                        ${q.choices.map((c, index) => {
                            const choiceLetter = ["A", "B", "C", "D"][index];
                            return `
                            <label class="radio-label">
                                <input type="radio" name="q${q.id}" value="${choiceLetter}" class="hidden" onchange="updateProgress()">
                                <div class="w-5 h-5 border-2 border-black rounded-full ml-3 flex items-center justify-center indicator transition-all"></div>
                                <span class="font-bold">${c}</span>
                            </label>
                            `;
                        }).join("")}
                    </div>
                </div>
            `).join("");

            form.querySelectorAll('input[type="radio"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const parent = e.target.closest('.choices-area');
                    parent.querySelectorAll('.radio-label').forEach(l => {
                        l.classList.remove('selected-answer');
                        l.querySelector('.indicator').classList.remove('bg-white');
                    });
                    const selectedLabel = e.target.closest('.radio-label');
                    selectedLabel.classList.add('selected-answer');
                    selectedLabel.querySelector('.indicator').classList.add('bg-white');
                });
            });
        }

        function updateProgress() {
            const answered = document.querySelectorAll('input[type="radio"]:checked').length;
            const percentage = (answered / questions.length) * 100;
            document.getElementById("progress-bar").style.width = percentage + "%";
        }

        async function submitQuiz() {
            const inputs = document.querySelectorAll('input[type="radio"]:checked');
            if (inputs.length < questions.length) {
                alert("يرجى الإجابة على جميع الأسئلة.");
                return;
            }

            if (!confirm("تأكيد إنهاء الاختبار؟ لا يمكن التعديل لاحقاً.")) return;

            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري حفظ وإرسال النتيجة...';

            let score = 0;
            questions.forEach(q => {
                const picked = document.querySelector(`input[name="q${q.id}"]:checked`);
                // q.correct بتحتوي على الحرف الصحيح (A, B, C, D) واللي إحنا حطيناه كـ value في الـ input
                if (picked && picked.value === q.correct) score++;
            });

            try {
                // إرسال النتيجة لقاعدة البيانات (Supabase)
                await supabaseRequest('POST', 'kenzy_results', '', {
                    student_name: student.name,
                    student_code: student.code,
                    class_name: student.className,
                    quiz_id: currentQuizId,
                    score: score,
                    total_questions: questions.length
                });

                student.score = `${score}/${questions.length}`;

                // تشفير النتيجة وعرض الـ QR Code
                const studentDataToEncrypt = { name: student.name, code: student.code, score: student.score };
                const encryptedText = CryptoJS.AES.encrypt(JSON.stringify(studentDataToEncrypt), SECRET_KEY).toString();

                document.getElementById("progress-container").classList.add("hidden");
                document.getElementById("quiz-section").classList.add("hidden");
                document.getElementById("finalResultContainer").classList.remove("hidden");
                document.getElementById("resCode").textContent = student.code;

                document.getElementById("qrcode").innerHTML = ""; 
                new QRCode(document.getElementById("qrcode"), {
                    text: encryptedText, width: 220, height: 220, colorDark : "#000", colorLight : "#fff", correctLevel : QRCode.CorrectLevel.H
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                alert("حدث خطأ أثناء حفظ النتيجة، حاول مرة أخرى.");
                btn.disabled = false;
                btn.innerHTML = '<span>اعتماد الإجابات وإنهاء</span> <i class="fa-solid fa-check"></i>';
            }
        }
        // ==========================================
        // نظام تشغيل الفيديوهات المدمج (Embed Player)
        // ==========================================
        // ==========================================
        // نظام تشغيل الفيديوهات المدمج (Custom YouTube API)
        // ==========================================
        let tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        let firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let ytPlayer;
        let progressInterval;
        let isPlaying = false;
        let isMuted = false;
        let isDragging = false; // متغير جديد لمنع تضارب الوقت أثناء السحب
        const speeds = [1, 1.25, 1.5, 2, 0.5]; // سرعات الفيديو
        let currentSpeedIdx = 0;

        function extractYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function onYouTubeIframeAPIReady() {}

        function openVideoModal(url, title) {
            const videoId = extractYouTubeID(url);
            if (!videoId) { alert("رابط الفيديو غير صالح."); return; }

            document.getElementById('videoModalTitle').textContent = title;
            const modal = document.getElementById('videoModal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);

            if (!ytPlayer) {
                ytPlayer = new YT.Player('youtubePlayer', {
                    videoId: videoId,
                    playerVars: {
                        'autoplay': 1, 'controls': 0, 'disablekb': 1, 
                        'modestbranding': 1, 'rel': 0, 'showinfo': 0, 'fs': 0, 'playsinline': 1
                    },
                    events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
                });
            } else {
                ytPlayer.loadVideoById(videoId);
            }
            
            // إعادة ضبط الإعدادات عند فتح فيديو جديد
            document.getElementById('speedBtn').innerText = '1x';
            currentSpeedIdx = 0;
            document.getElementById('progressBar').value = 0;
        }

        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            modal.classList.add('opacity-0');
            setTimeout(() => { 
                modal.classList.add('hidden'); 
                if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
                clearInterval(progressInterval);
                if (document.fullscreenElement) document.exitFullscreen(); // الخروج من الفول إسكرين لو كان مفتوح
            }, 300);
        }

        function onPlayerReady(event) { event.target.playVideo(); }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('playPauseBtn').innerHTML = '<i class="fa-solid fa-pause"></i>';
                startProgressBar();
            } else {
                isPlaying = false;
                document.getElementById('playPauseBtn').innerHTML = '<i class="fa-solid fa-play"></i>';
                clearInterval(progressInterval);
            }
        }

        function togglePlayPause() {
            if (isPlaying) ytPlayer.pauseVideo();
            else ytPlayer.playVideo();
        }

        // دالة التقديم والتأخير 10 ثواني
        function skipVideo(seconds) {
            if (ytPlayer && ytPlayer.getCurrentTime) {
                const currentTime = ytPlayer.getCurrentTime();
                const duration = ytPlayer.getDuration();
                let newTime = currentTime + seconds;
                if(newTime < 0) newTime = 0;
                if(newTime > duration) newTime = duration;
                ytPlayer.seekTo(newTime, true);
            }
        }

        // دالة تغيير السرعة
        function changeSpeed() {
            if(ytPlayer && ytPlayer.setPlaybackRate) {
                currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
                const speed = speeds[currentSpeedIdx];
                ytPlayer.setPlaybackRate(speed);
                document.getElementById('speedBtn').innerText = speed + 'x';
            }
        }

        function toggleMute() {
            if (isMuted) {
                ytPlayer.unMute();
                isMuted = false;
                document.getElementById('muteBtn').innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            } else {
                ytPlayer.mute();
                isMuted = true;
                document.getElementById('muteBtn').innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            }
        }

        // دوال شريط السحب الجديدة
        function seekVideoDrag(val) {
            isDragging = true;
            if (ytPlayer && ytPlayer.getDuration) {
                const duration = ytPlayer.getDuration();
                const time = (val / 100) * duration;
                document.getElementById('timeDisplay').innerText = formatTime(time);
            }
        }

        function seekVideoDrop(val) {
            if (ytPlayer && ytPlayer.getDuration) {
                const duration = ytPlayer.getDuration();
                const newTime = (val / 100) * duration;
                ytPlayer.seekTo(newTime, true);
            }
            isDragging = false;
        }

        function startProgressBar() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if(ytPlayer && ytPlayer.getCurrentTime && !isDragging) {
                    const currentTime = ytPlayer.getCurrentTime();
                    const duration = ytPlayer.getDuration();
                    const percentage = (currentTime / duration) * 100;
                    document.getElementById('progressBar').value = percentage;
                    document.getElementById('timeDisplay').innerText = formatTime(currentTime);
                }
            }, 500);
        }

        function formatTime(seconds) {
            if(!seconds) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function toggleFullscreen() {
            const container = document.getElementById('videoPlayerContainer');
            
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen().then(lockLandscape);
                } else if (container.webkitRequestFullscreen) { /* Safari */
                    container.webkitRequestFullscreen();
                    lockLandscape();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(unlockOrientation);
                }
            }
        }

        function lockLandscape() {
            // محاولة قلب الشاشة بالعرض للموبايلات
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(err => console.log("Orientation lock failed:", err));
            }
        }

        function unlockOrientation() {
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        }
    </script>
</body>
